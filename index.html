<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Karaoke Listener</title>
<meta name="description" content="Transcription helper for brightlab.neocities.org/karaoke. Runs Whisper in the browser; nothing is uploaded.">
</head>
<body>
<p>This page is a behind-the-scenes helper for <a href="https://brightlab.neocities.org/karaoke">Cosmec Karaoke Lab</a>.
It writes out song lyrics using Whisper, running entirely in your browser.</p>
<script type="module">
/* Neocities free sites can't fetch from other domains (CSP connect-src 'self'),
   so the karaoke page embeds this page in a hidden iframe and talks to it with postMessage. */
const ALLOWED = ["https://brightlab.neocities.org", "http://127.0.0.1:8765", "http://localhost:8765", "http://127.0.0.1:8768"];
// Bigger models are far better on sung vocals but only practical on a GPU; CPU-only machines use base.
// q8 weights produce gibberish on WebGPU, so GPU presets avoid them.
const PRESETS = {
  base:  { model:"Xenova/whisper-base.en", english:true,
           gpu:{encoder_model:"fp32", decoder_model_merged:"q4"}, cpu:"q8" },
  small: { model:"onnx-community/whisper-small.en_timestamped", english:true,
           gpu:{encoder_model:"fp32", decoder_model_merged:"q4"},
           gpu16:{encoder_model:"fp16", decoder_model_merged:"q4"} },
  turbo: { model:"onnx-community/whisper-large-v3-turbo_timestamped", english:false,
           gpu:{encoder_model:"q4", decoder_model_merged:"q4"},
           gpu16:{encoder_model:"q4f16", decoder_model_merged:"q4f16"} },
};
const WANT = new URLSearchParams(location.search).get("m") || "base";
let pipe = null, preset = null, busy = false;

async function load(reply){
  if(pipe) return pipe;
  const {pipeline} = await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.2.4");
  let gpu = false, f16 = false;                  // only try WebGPU if a real adapter exists —
  try{ const a = navigator.gpu && await navigator.gpu.requestAdapter();   // a failed attempt poisons the wasm fallback
       gpu = !!a; f16 = !!(a && a.features.has("shader-f16")); }catch(e){}
  preset = PRESETS[gpu && PRESETS[WANT] ? WANT : "base"];
  const files = {};
  pipe = await pipeline("automatic-speech-recognition", preset.model, {
    dtype: !gpu ? preset.cpu : (f16 && preset.gpu16) || preset.gpu,
    device: gpu ? "webgpu" : "wasm",
    progress_callback: p => {
      if(p.status==="progress" && p.total){ files[p.file]=[p.loaded,p.total];
        let L=0,T=0; for(const k in files){ L+=files[k][0]; T+=files[k][1]; }
        reply({type:"download", pct:Math.round(L/T*100)}); }
    }
  });
  return pipe;
}

const SR=16000, WIN=28, HOP=24;
const norm = s => s.toLowerCase().replace(/[^a-z0-9']/g,"");

// One full-length window starting at s (short windows break Whisper's word timing). Absolute-time words.
async function listenAt(p, audio, s){
  const total=audio.length/SR;
  s=Math.max(0, Math.min(s, total-WIN));
  const seg=audio.subarray(Math.floor(s*SR), Math.min(audio.length, Math.floor((s+WIN)*SR)));
  const opts={return_timestamps:"word", max_new_tokens:200};          // cap runaway decoding on music
  if(!preset.english) Object.assign(opts,{language:"english", task:"transcribe"});
  const out=await p(seg, opts);
  const words=[];
  for(const c of out.chunks||[]){
    const t0=c.timestamp&&c.timestamp[0], t1=c.timestamp&&c.timestamp[1];
    const text=(c.text||"").trim();
    if(!text || !isFinite(t0) || /^\[.*\]$|^\(.*\)$|^♪+$/.test(text)) continue;   // drop [Music] / ♪ tags
    words.push({text, t:s+t0, d:Math.max(0.12,(isFinite(t1)?t1-t0:0.3))});
  }
  return {s, words};
}

async function transcribe(audio, reply){
  const p = await load(reply);
  const total=audio.length/SR;

  // Pass 1: overlapping windows; each keeps the words up to the middle of its overlap with the next.
  const starts=[]; for(let s=0;;s+=HOP){ if(s+WIN>=total){ starts.push(Math.max(0,total-WIN)); break; } starts.push(s); }
  let words=[];
  for(let i=0;i<starts.length;i++){
    reply({type:"listen", pct:Math.round(i/starts.length*80)});
    const {words:ws}=await listenAt(p, audio, starts[i]);
    const lo=i? (starts[i-1]+WIN+starts[i])/2 : 0;
    const hi=i<starts.length-1? (starts[i]+WIN+starts[i+1])/2 : Infinity;
    words.push(...ws.filter(w=>w.t>=lo && w.t<hi));
  }

  // Pass 2: Whisper writes nothing for a window that opens with ~12s+ of instrumental, so lines after
  // intros and breaks go missing. Re-listen to each silent gap starting just before the next heard word,
  // walking backwards until nothing new turns up.
  const GAP=6, LEAD=8, MAX_RETRIES=16;
  words.sort((x,y)=>x.t-y.t);
  const gaps=[]; let end=0;
  for(const w of words){ if(w.t-end>GAP) gaps.push([end,w.t]); end=Math.max(end,w.t+w.d); }
  if(total-end>GAP) gaps.push([end,total]);
  let tries=0;
  for(const [g0,gEnd] of gaps){
    let g1=gEnd;
    while(tries<MAX_RETRIES && g1-g0>2){
      const trailing=g1>=total, start=trailing? g0 : Math.max(g0, g1-LEAD);
      tries++;
      reply({type:"listen", pct:Math.min(99, 80+tries*2)});
      const {words:ws}=await listenAt(p, audio, start);
      const found=ws.filter(w=>w.t>g0+0.2 && w.t<g1-0.2);
      if(!found.length) break;
      words.push(...found.map(w=>({...w, refill:true})));
      const first=Math.min(...found.map(w=>w.t));
      if(trailing || start<=g0 || first>=g1-0.5) break;
      g1=first;
    }
  }

  // Tidy: drop re-listened words that duplicate ones already heard, then re-seat stray short words
  // (Whisper's timing often parks a line's first word seconds before the rest of the line).
  words.sort((x,y)=>x.t-y.t);
  words=words.filter(w=>!w.refill || !words.some(v=>!v.refill && norm(v.text)===norm(w.text) && Math.abs(w.t-v.t)<1));
  for(let i=0;i<words.length;i++){
    const w=words[i], prev=words[i-1], next=words[i+1];
    if(next && norm(w.text).length<=4 && next.t-(w.t+w.d)>2.5 && (!prev || w.t-(prev.t+prev.d)>2.5)){
      w.d=Math.min(w.d,0.35); w.t=next.t-w.d-0.05;
    }
  }
  return words;
}

addEventListener("message", async e => {
  if(!ALLOWED.includes(e.origin)) return;
  const msg=e.data||{};
  if(msg.type!=="transcribe" || !(msg.audio instanceof Float32Array)) return;
  const reply=m=>e.source.postMessage({...m, id:msg.id}, e.origin);
  if(busy){ reply({type:"error", message:"busy"}); return; }
  busy=true;
  try{ reply({type:"result", words:await transcribe(msg.audio, reply)}); }
  catch(err){ reply({type:"error", message:String(err&&err.message||err)}); }
  finally{ busy=false; }
});
if(parent!==window) for(const o of ALLOWED) parent.postMessage({type:"ready"}, o);
</script>
</body>
</html>
